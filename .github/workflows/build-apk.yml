name: Build AutoStreak 10A16 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Cấu hình Gradle 8.5 & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 5. Biên dịch file APK
        run: gradle assembleDebug --no-daemon

      - name: 6. Đóng gói file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: AutoStreak-10A16-APK
          path: app/build/outputs/apk/debug/app-debug.apk
