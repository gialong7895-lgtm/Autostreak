plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stem10a16.autostreak'
    compileSdk 34

    defaultConfig {
        applicationId "com.stem10a16.autostreak"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-STEM10A16"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Sử dụng hoàn toàn Android SDK nguyên bản để build nhanh và ổn định tuyệt đối
}
